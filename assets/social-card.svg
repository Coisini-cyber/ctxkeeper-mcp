<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="ctxkeeper — durable project memory for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1120" cy="110" r="300" fill="url(#glow)"/>
  <circle cx="170" cy="590" r="220" fill="#22d3ee" opacity="0.05"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="108" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7f8ea8" letter-spacing="2">$ ctxkeeper --stdio</text>

    <text x="72" y="180" font-size="50" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Your agent forgets</text>
    <text x="72" y="236" font-size="50" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">everything between</text>
    <text x="72" y="292" font-size="50" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">sessions.</text>

    <text x="74" y="344" font-size="22" fill="#a8b6cc">Durable project memory + token-budgeted context packs.</text>
    <text x="74" y="376" font-size="22" fill="#a8b6cc">No API keys. No vector DB. No telemetry.</text>

    <g font-size="16" font-family="Consolas, Menlo, monospace">
      <rect x="72" y="412" width="136" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="140" y="435" fill="#c7d2e5" text-anchor="middle">local-first</text>

      <rect x="220" y="412" width="164" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="302" y="435" fill="#c7d2e5" text-anchor="middle">zero API keys</text>

      <rect x="396" y="412" width="152" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="472" y="435" fill="#c7d2e5" text-anchor="middle">10 e2e tests</text>
    </g>

    <text x="72" y="524" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8b5cf6">github.com/</text>
    <text x="196" y="524" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e2e8f0">Coisini-cyber/ctxkeeper-mcp</text>
    <text x="72" y="568" font-size="17" fill="#6f7f98">MIT · Node &gt;= 20.11 · MCP stdio · v0.1.0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="118" width="508" height="420" rx="18" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="700" y="118" width="508" height="46" rx="18" fill="#111a2e"/>
    <rect x="700" y="146" width="508" height="18" fill="#111a2e"/>
    <circle cx="728" cy="141" r="6" fill="#ff5f57"/>
    <circle cx="750" cy="141" r="6" fill="#febc2e"/>
    <circle cx="772" cy="141" r="6" fill="#28c840"/>
    <text x="954" y="147" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5f6f88" text-anchor="middle">ctxkeeper — demo</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="16">
    <text x="730" y="204" fill="#7dd3fc">$ project_brief</text>
    <text x="730" y="230" fill="#94a3b8">stack · commands · TODOs</text>
    <text x="730" y="254" fill="#4ade80">✓ 1.2k tokens</text>

    <text x="730" y="300" fill="#7dd3fc">$ context_pack("oauth refresh")</text>
    <text x="730" y="326" fill="#94a3b8">src/auth/refresh.ts:42-78</text>
    <text x="730" y="350" fill="#4ade80">✓ 1.0k tokens</text>

    <text x="730" y="396" fill="#7dd3fc">$ remember(gotcha, ...)</text>
    <text x="730" y="422" fill="#4ade80">✓ saved to .ctxkeeper/</text>

    <text x="730" y="468" fill="#7dd3fc">$ log_work(...)</text>
    <text x="730" y="494" fill="#4ade80">✓ handoff ready for tomorrow</text>
  </g>

  <rect x="0" y="636" width="1280" height="4" fill="url(#accent)"/>
</svg>
